<div class="verify-modal-overlay" id="verifyModal">
        <div class="verify-box p-6 text-center">
            <h3 class="font-normal text-[22px] text-black mb-1">Verify that it's you</h3>
            <p class="text-gray-600 text-[14px] mb-6">Confirm that you're not a robot</p>
            
            <div class="recaptcha-cont" onclick="startCaptcha(event)">
                <div class="flex items-center gap-3">
                    <div class="recaptcha-checkbox" id="rc-check"></div>
                    <div class="rc-spinner" id="rc-spinner"></div>
                    <span class="text-[#222] font-normal text-[14px] tracking-wide">I'm not a robot</span>
                </div>
                <div class="flex flex-col items-center">
                    <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA" class="w-8 opacity-80 mb-1">
                    <div class="text-[8px] text-[#555] flex items-center gap-1 font-medium">
                        <a href="https://policies.google.com/privacy" target="_blank" class="hover:underline" onclick="event.stopPropagation()">Privacy</a> - 
                        <a href="https://policies.google.com/terms" target="_blank" class="hover:underline" onclick="event.stopPropagation()">Terms</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
